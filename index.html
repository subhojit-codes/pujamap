
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#65152a">
<title>PujaMap | Chittaranjan Durga Puja 2026</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--wine:#65152a;--gold:#e0b75b;--cream:#fff8ec;--ink:#302126}
*{box-sizing:border-box}
body{margin:0;font-family:Arial, sans-serif;background:var(--cream);color:var(--ink)}
header{padding:18px 16px;background:linear-gradient(120deg,#451020,#812039);color:white;border-bottom:3px solid var(--gold)}
h1{margin:0;color:#f0c967;font-family:Georgia,serif;letter-spacing:2px;font-size:25px}
header p{margin:5px 0 0;font-size:14px}
.hero{padding:14px 16px;background:#fffaf1}
.hero h2{margin:0 0 5px;color:var(--wine);font-family:Georgia,serif}
.hero p{margin:0;font-size:13px;line-height:1.5}
.stats{padding:12px 16px;background:var(--wine);color:white}
.stats strong{font: bold 23px Georgia,serif;color:#f0c967}
.progress{height:7px;background:#a76a78;border-radius:10px;margin:8px 0}
.progress span{display:block;height:100%;width:0;background:#f0c967}
#map{height:48vh;min-height:300px;width:100%;z-index:1}
.controls{padding:14px;background:var(--cream)}
#search{width:100%;padding:13px;border:1px solid #d6c7a8;border-radius:12px;font-size:16px;background:white}
#locate{margin-top:9px;padding:11px 14px;border:0;border-radius:10px;background:var(--wine);color:#f0c967;font-weight:bold;font-size:14px}
#list{padding:0 14px 24px}
.item{display:flex;align-items:center;gap:11px;padding:13px 2px;border-bottom:1px solid #eadcc3}
.num{width:36px;height:36px;flex-shrink:0;border-radius:50%;display:grid;place-items:center;background:var(--wine);color:#f0c967;font-weight:bold}
.name{font-weight:bold;flex:1;cursor:pointer}
.sub{font-size:12px;color:#75665f;margin-top:4px}
.visit{border:0;background:transparent;color:var(--wine);font-size:12px;font-weight:bold;padding:8px 0}
.visit.yes{color:#276749}
.notice{font-size:12px;color:#75665f;line-height:1.5;padding:12px 0}
footer{text-align:center;padding:16px;background:#451020;color:#fff1d8;font-size:12px}
.leaflet-popup-content{font-weight:bold}
@media(min-width:800px){#map{height:58vh}.hero,.controls,#list{padding-left:24px;padding-right:24px}}
</style>
</head>
<body>
<header>
<h1>CHITTARANJAN</h1>
<p>Durga Puja Navigator · 2026</p>
</header>

<section class="hero">
<h2>Find Your Puja ✨</h2>
<p>Explore Chittaranjan's Durga Puja locations. Select a map pin or pandal name to see its location and get directions.</p>
</section>

<section class="stats">
<div>🪔 DURGA PUJA 2026</div>
<strong><span id="count">0</span> / 11 Visited</strong>
<div class="progress"><span id="bar"></span></div>
<div id="remaining">11 Pujas Remaining</div>
</section>

<div id="map" aria-label="Chittaranjan Durga Puja map"></div>

<section class="controls">
<input id="search" type="search" placeholder="🔎 Search pandal..." aria-label="Search pandals">
<br>
<button id="locate">⌖ Show My Location</button>
</section>

<div id="list"></div>
<footer>Made for Durga Puja 2026 · Chittaranjan</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const pujas = [
 {id:1,name:"Area 6",lat:23.8461063,lon:86.9111291},
 {id:2,name:"Area 5",lat:23.8419200,lon:86.8966939},
 {id:3,name:"Hospital Colony",lat:23.8504133,lon:86.8966588},
 {id:4,name:"Area 4, Ravindra Manch",lat:23.8460140,lon:86.9044070},
 {id:5,name:"Area 2, Ribbon Area",lat:23.8709240,lon:86.9026420},
 {id:6,name:"Area 7, Simjhuri",lat:23.8763010,lon:86.9102490},
 {id:7,name:"Area 1, Fathepur",lat:23.8651730,lon:86.9162690},
 {id:8,name:"DeshBandhu Park",lat:23.8307400,lon:86.8984240},
 {id:9,name:"Area 8",lat:23.8501480,lon:86.8888930},
 {id:10,name:"R. Side",lat:23.8636450,lon:86.8980570},
 {id:11,name:"S.P. North",lat:23.8720550,lon:86.8979010}
];

const map = L.map("map").setView([23.8565,86.9020],14);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{
 maxZoom:19,
 attribution:"&copy; OpenStreetMap contributors"
}).addTo(map);

const visitedKey = "pujamap_chittaranjan_2026_visited";
let userMarker = null;

function getVisited(){
 try{return JSON.parse(localStorage.getItem(visitedKey)||"[]")}
 catch(e){return []}
}

function updateStats(){
 const v=getVisited();
 document.getElementById("count").textContent=v.length;
 document.getElementById("bar").style.width=(v.length/pujas.length*100)+"%";
 document.getElementById("remaining").textContent=
  (pujas.length-v.length)+" Pujas Remaining";
}

function directions(p){
 window.open(
  "https://www.google.com/maps/dir/?api=1&destination="+p.lat+","+p.lon,
  "_blank"
 );
}

function selectPuja(p){
 map.flyTo([p.lat,p.lon],16);
 L.popup().setLatLng([p.lat,p.lon])
  .setContent(
   "<b>"+p.name+"</b><br><br>"+
   "<button onclick='window.open(\"https://www.google.com/maps/dir/?api=1&destination="+p.lat+","+p.lon+"\",\"_blank\")'>Get Directions</button>"
  ).openOn(map);
}

function toggleVisited(id){
 let v=getVisited();
 v=v.includes(id)?v.filter(x=>x!==id):v.concat(id);
 try{localStorage.setItem(visitedKey,JSON.stringify(v))}catch(e){}
 renderList();
 updateStats();
}

function renderList(){
 const q=document.getElementById("search").value.trim().toLowerCase();
 const list=document.getElementById("list");
 list.innerHTML="";

 pujas.filter(p=>p.name.toLowerCase().includes(q)).forEach(p=>{
  const yes=getVisited().includes(p.id);
  const row=document.createElement("div");
  row.className="item";

  const num=document.createElement("div");
  num.className="num";
  num.textContent=p.id;

  const info=document.createElement("div");
  info.style.flex="1";
  const name=document.createElement("div");
  name.className="name";
  name.textContent=p.name;
  const sub=document.createElement("div");
  sub.className="sub";
  sub.textContent="Chittaranjan, West Bengal";
  info.append(name,sub);
  info.onclick=()=>selectPuja(p);

  const visit=document.createElement("button");
  visit.className="visit"+(yes?" yes":"");
  visit.textContent=yes?"✓ Visited":"Mark Visited";
  visit.onclick=()=>toggleVisited(p.id);

  row.append(num,info,visit);
  list.appendChild(row);
 });
}

pujas.forEach(p=>{
 const icon=L.divIcon({
  className:"",
  html:'<div style="background:#65152a;color:#f0c967;border:2px solid #e0b75b;border-radius:50% 50% 50% 5px;transform:rotate(-45deg);width:34px;height:38px;display:grid;place-items:center;font-weight:bold"><span style="transform:rotate(45deg)">'+p.id+'</span></div>',
  iconSize:[34,38],
  iconAnchor:[17,36]
 });
 L.marker([p.lat,p.lon],{icon})
  .addTo(map)
  .bindPopup(p.name)
  .on("click",()=>selectPuja(p));
});

document.getElementById("search").addEventListener("input",renderList);

document.getElementById("locate").onclick=()=>{
 if(!navigator.geolocation){
  alert("Location is not supported by this browser.");
  return;
 }
 navigator.geolocation.getCurrentPosition(pos=>{
  const ll=[pos.coords.latitude,pos.coords.longitude];
  if(userMarker)map.removeLayer(userMarker);
  userMarker=L.circleMarker(ll,{
   radius:9,color:"#fff",weight:3,
   fillColor:"#2878d0",fillOpacity:1
  }).addTo(map).bindPopup("Your location").openPopup();
  map.flyTo(ll,15);
 },()=>{
  alert("Location permission was not granted. The pandal map and directions still work.");
 },{enableHighAccuracy:true,timeout:10000});
};

renderList();
updateStats();
</script>
</body>
</html>
